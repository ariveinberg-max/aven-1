<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aven-1 Chat</title>
<style>
:root{color-scheme:dark;--bg:#0a0b0c;--panel:#131415;--panel2:#101112;--line:#232426;--line2:#2c2d30;--ink:#eeeeef;--muted:#8b8b90;--dim:#5c5c60;--accent:#e8e8ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(155deg,#3a4a56,#1c2226);border:1px solid #3a4750;display:flex;align-items:center;justify-content:center;flex:none}
.brand .mark svg{width:12px;height:12px}
.brand .name{font-size:13px;font-weight:600;letter-spacing:-.2px}
.pill{font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:1px;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
.pill.live{color:#8fd19e;border-color:#2b4030}
.dash-link{font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line2);padding:6px 11px;border-radius:6px}
.dash-link:hover{color:var(--ink);border-color:var(--line)}
.topbar-right{display:flex;align-items:center;gap:10px}

.wrap{flex:1;min-height:0;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;padding:0 20px}
.notice{margin:16px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12px;line-height:1.6}
.chatlog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:20px 0}
.chatlog:empty::before{content:'Ask something to get started.';color:var(--dim);font-size:13px;display:block;text-align:center;margin-top:60px}
.bubble{max-width:80%;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.user{align-self:flex-end;background:#232b30;color:var(--ink)}
.bubble.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);color:#d6d6d9}
.bubble.pending{color:var(--dim);font-style:italic}
.composer{flex:none;padding:14px 0 20px;border-top:1px solid var(--line)}
.composer .row{display:flex;gap:8px;align-items:flex-end}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:11px 13px;border-radius:8px;font-size:13.5px;font-family:inherit;resize:none;min-height:44px;max-height:160px}
textarea:focus-visible,button:focus-visible{outline:2px solid #4a5560;outline-offset:2px}
button{border:0;border-radius:8px;background:var(--accent);color:#111;padding:11px 18px;font-weight:600;font-size:12.5px;cursor:pointer}
button:hover:not(:disabled){background:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
.secondary{background:#1c1d1f;color:var(--ink);border:1px solid var(--line2)}
.secondary:hover:not(:disabled){background:#232426}
.hint{font-size:10.5px;color:var(--dim);margin-top:8px;text-align:center}
#msg{color:#ddb98a;font-size:11.5px;text-align:center;min-height:16px;margin-top:6px}
</style>
<div class="topbar">
<div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#cfe3ee" stroke-width="1.4"/><circle cx="4" cy="6" r="1.6" fill="#cfe3ee"/><circle cx="20" cy="6" r="1.6" fill="#cfe3ee"/><circle cx="4" cy="18" r="1.6" fill="#cfe3ee"/><circle cx="20" cy="18" r="1.6" fill="#cfe3ee"/><path d="M9.8 10.3 5.2 6.9M14.2 10.3 18.8 6.9M9.8 13.7 5.2 17.1M14.2 13.7 18.8 17.1" stroke="#4a6270" stroke-width="1.1"/></svg></div><div class="name">Aven-1</div></div>
<div class="topbar-right"><span class="pill" id="stage">…</span><a class="dash-link" href="/">Dashboard</a></div>
</div>
<div class="wrap">
<div id="notice" class="notice" hidden></div>
<div id="chatLog" class="chatlog"></div>
<div class="composer">
<div class="row"><textarea id="chatInput" placeholder="Ask something, calculate (2+3)*4, or /recall a topic…" maxlength="2000" rows="1"></textarea><button id="chatSend" disabled>Send</button><button id="chatClear" class="secondary">Clear</button></div>
<p class="hint">Small model trained from scratch. Calculations and saved-note recall use local tools.</p>
<div id="msg" role="status"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let busy=false,chatHistory=[],ready=false;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(path,body){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function renderChat(){
 $('chatLog').innerHTML=chatHistory.map(m=>`<div class="bubble ${m.role}${m.pending?' pending':''}">${esc(m.content)}</div>`).join('');
 $('chatLog').scrollTop=$('chatLog').scrollHeight;
}
async function sendChat(){
 let text=$('chatInput').value.trim();
 if(!text||busy||!ready)return;
 busy=true;$('msg').textContent='';
 chatHistory.push({role:'user',content:text});
 $('chatInput').value='';$('chatInput').style.height='auto';
 chatHistory.push({role:'assistant',content:'…thinking…',pending:true});
 renderChat();
 try{
  let d=await api('chat',{messages:chatHistory.filter(m=>!m.pending).slice(-19).map(m=>({role:m.role,content:m.content}))});
  chatHistory.pop();
  chatHistory.push({role:'assistant',content:d.reply||'(empty response)'});
  $('msg').textContent=d.tool==='calculator'?'Calculated exactly':d.tool==='memory'?'Retrieved from saved notes':d.context?.omitted_messages?'Older messages omitted to fit this model’s context':'';
 }catch(e){
  chatHistory.pop();
  $('msg').textContent=e.message;
 }
 renderChat();busy=false;await poll();
}
$('chatSend').onclick=sendChat;
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
$('chatInput').addEventListener('input',()=>{$('chatInput').style.height='auto';$('chatInput').style.height=Math.min($('chatInput').scrollHeight,160)+'px'});
$('chatClear').onclick=()=>{if(!busy){chatHistory=[];renderChat()}};

async function poll(){
 try{
  let r=await fetch('/api/status');let state=await r.json();
  const modelReady=state.stage==='finetune'&&!state.running&&state.checkpoint;
  ready=true;
  $('chatSend').disabled=!ready||busy;$('chatInput').disabled=!ready;
  $('stage').textContent=modelReady?'READY':'TOOLS READY';
  $('stage').classList.toggle('live',ready);
  let notice=$('notice');
  if(!modelReady){
   notice.hidden=false;
   notice.textContent=state.running?'Training is running. Calculations and /recall searches are available now; model answers resume after training.':'Calculations and /recall searches are ready. Model answers need a fine-tuned checkpoint.';
  }else{
   notice.hidden=true;
  }
 }catch(e){
  ready=false;$('chatSend').disabled=true;
  $('stage').textContent='OFFLINE';
  $('notice').hidden=false;
  $('notice').textContent='Cannot reach the local server.';
 }
}
poll();setInterval(poll,2000);
</script></html>
