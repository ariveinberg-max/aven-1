# Stage 5 experiment (synthetic). See docs/experiments/.
name: stage5-nl-r3
description: Spatial-field decoder, R3 (3-channel target montage).
purpose: benchmark
datasets:
- synthetic_mi
- synthetic_mi_shifted
synthetic:
  n_subjects: 8
  n_trials_per_class: 70
  signal_to_noise: 0.5
  subject_variability: 1.0
  seed: 3
decoder:
  name: nl_spatial_field
  params: {}
protocol:
  regime: leave_dataset_out
  ks:
  - 0
  - 5
  - 10
  - 20
  - 40
  n_unlabeled: 20
  trial_seconds: 2.0
  target_montage: bci_iv_2b
