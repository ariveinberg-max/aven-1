# Stage 5 experiment (synthetic). See docs/experiments/.
name: stage5-h2-noadapt-r2
description: 'H2 control: no target alignment, no fine-tuning, R2.'
purpose: benchmark
datasets:
- synthetic_mi
- synthetic_mi_shifted
synthetic:
  n_subjects: 8
  n_trials_per_class: 70
  signal_to_noise: 0.5
  subject_variability: 1.0
  seed: 3
decoder:
  name: nl_spatial_field
  params:
    align_target: false
    finetune_epochs: 0
protocol:
  regime: leave_dataset_out
  ks:
  - 0
  - 5
  - 10
  - 20
  - 40
  n_unlabeled: 20
  trial_seconds: 2.0
