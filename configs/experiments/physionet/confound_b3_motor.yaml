# Confound check (analysis montage): which Crown channels carry the left/right signal?
name: physionet-confound-b3-motor
description: B3 (ts_lr_pooled) on PhysioNet MI, R1 with only the Crown's motor channels.
purpose: benchmark
datasets: [physionet_mi]
decoder:
  name: ts_lr_pooled
  params: {}
protocol:
  regime: within_dataset
  n_folds: 5
  target_montage: neurosity_crown_motor
  ks: [0, 5, 8]
  n_unlabeled: 10
  trial_seconds: 2.0
  min_test_per_class: 10
  seed: 0
