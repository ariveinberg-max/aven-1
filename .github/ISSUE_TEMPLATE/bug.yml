name: Bug report
description: Something is broken
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce (commands, config, run id) }
    validations: { required: true }
  - type: textarea
    id: env
    attributes: { label: Environment (OS / WSL / Mac, Python, GPU) }
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This report contains no neural data from people, no secrets and no proprietary results.
          required: true
